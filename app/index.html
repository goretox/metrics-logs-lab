<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Prueba - Observabilidad Logs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.8;
        }
        .btn-success { background-color: #22c55e; color: white; }
        .btn-error { background-color: #ef4444; color: white; }
        .btn-custom { background-color: #eab308; color: black; }
        
        #log-output {
            background-color: #0f172a;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.9rem;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Generador de Logs</h1>
        
        <div class="btn-group">
            <button class="btn-success" onclick="sendEvent('success')">Simular Éxito (200 OK)</button>
            <button class="btn-error" onclick="sendEvent('error')">Simular Error HTTP</button>
            <button class="btn-custom" onclick="sendCustomEvent()">Evento Personalizado</button>
        </div>

        <div id="log-output">Esperando acción...</div>
    </div>

    <script>
        function sendEvent(type) {
            const output = document.getElementById('log-output');
            const now = new Date().toLocaleTimeString();

            if (type === 'success') {
                // Petición HTTP a la raíz (Devuelve HTTP 200)
                fetch('/')
                    .then(() => {
                        output.style.color = '#4ade80';
                        output.innerText = `[${now}] SUCCESS: Petición HTTP enviada (200 OK)`;
                    });

            } else if (type === 'error') {
                // Petición HTTP a una ruta no existente (Devuelve HTTP 404 en Nginx)
                fetch('/simular-error-500')
                    .then(() => {
                        output.style.color = '#f87171';
                        output.innerText = `[${now}] ERROR: Petición de error enviada a Nginx`;
                    });
            }
        }

        function sendCustomEvent() {
            const msg = prompt("Ingresá un mensaje o código personalizado para el log:", "Mi evento custom");
            if (msg) {
                const output = document.getElementById('log-output');
                const now = new Date().toLocaleTimeString();
                
                // Petición HTTP enviando el texto en el query string
                fetch(`/custom-log?mensaje=${encodeURIComponent(msg)}`)
                    .then(() => {
                        output.style.color = '#fbbf24';
                        output.innerText = `[${now}] CUSTOM: "${msg}" enviado a Nginx`;
                    });
            }
        }
    </script>

</body>
</html>
